<main class="setup-page">
    <section class="setup-panel">
        <p class="eyebrow">First-time setup</p>
        <h1>Create the administrator</h1>
        <p class="intro">This one-time setup is available only before the first account is created.</p>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <label for="firstName">First name</label>
            <input id="firstName" formControlName="firstName" autocomplete="given-name">
            <label for="lastName">Last name</label>
            <input id="lastName" formControlName="lastName" autocomplete="family-name">
            <label for="email">Work email</label>
            <input id="email" type="email" formControlName="email" autocomplete="username">
            <label for="password">Password</label>
            <input id="password" type="password" formControlName="password" autocomplete="new-password">
            <small>Use at least 12 characters.</small>

            @if (errorMessage()) {
            <p class="error-message" role="alert">{{ errorMessage() }}</p>
            }

            <button type="submit" [disabled]="submitting() || form.invalid">
                {{ submitting() ? 'Creating account...' : 'Create administrator' }}
            </button>
        </form>

        <a routerLink="/login">Back to sign in</a>
    </section>
</main>
