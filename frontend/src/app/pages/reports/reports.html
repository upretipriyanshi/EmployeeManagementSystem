<div class="reports-container">
    <h2>Reports</h2>

    @if (isLoading()) {
    <p>Loading reports...</p>
    } @else if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
    } @else if (reportHtml()) {
    <iframe class="reports-frame" title="Reports Dashboard" sandbox="" [srcdoc]="reportHtml()">
    </iframe>
    }
</div>
