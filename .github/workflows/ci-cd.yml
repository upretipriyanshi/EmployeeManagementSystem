name: CI and Azure deployment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: /tmp/nuget/packages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare clean NuGet cache
        run: |
          mkdir -p /tmp/nuget/packages
          dotnet nuget locals all --clear

      - name: Restore API packages
        run: dotnet restore backend/EmployeeManagement.API.Tests/EmployeeManagement.API.Tests.csproj --disable-parallel --verbosity minimal

      - name: Test API
        run: dotnet test backend/EmployeeManagement.API.Tests/EmployeeManagement.API.Tests.csproj --configuration Release --no-restore

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    env:
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore API packages
        run: dotnet restore backend/EmployeeManagement.API/EmployeeManagement.API.csproj

      - name: Publish API
        run: dotnet publish backend/EmployeeManagement.API/EmployeeManagement.API.csproj --configuration Release --no-restore --output ${{ github.workspace }}/api-publish

      - name: Deploy API to Azure App Service
        if: ${{ env.AZURE_WEBAPP_NAME != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/api-publish

  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for Azure
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN != '' && env.API_BASE_URL != '' }}
        working-directory: frontend
        run: |
          npm ci
          node -e "require('node:fs').writeFileSync('public/app-config.js', 'window.appConfig = ' + JSON.stringify({apiBaseUrl: process.env.API_BASE_URL}) + ';\\n')"
          npm run build

      - name: Deploy frontend to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN != '' && env.API_BASE_URL != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist/frontend/browser
          api_location: ""
          output_location: ""
          skip_app_build: true
