name: CI and Azure deployment

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore API packages
        run: dotnet restore backend/EmployeeManagement.API.Tests/EmployeeManagement.API.Tests.csproj --disable-parallel --verbosity minimal

      - name: Test API
        run: dotnet test backend/EmployeeManagement.API.Tests/EmployeeManagement.API.Tests.csproj --configuration Release --no-restore

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build API container
        run: docker build -f backend/EmployeeManagement.API/Dockerfile backend/EmployeeManagement.API

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    env:
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: backend/EmployeeManagement.API
          file: backend/EmployeeManagement.API/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Deploy API to Azure App Service
        if: ${{ env.AZURE_WEBAPP_NAME != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for Azure
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN != '' && env.API_BASE_URL != '' }}
        working-directory: frontend
        run: |
          npm ci
          node -e "require('node:fs').writeFileSync('public/app-config.js', 'window.appConfig = ' + JSON.stringify({apiBaseUrl: process.env.API_BASE_URL}) + ';\\n')"
          npm run build

      - name: Deploy frontend to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN != '' && env.API_BASE_URL != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist/frontend/browser
          api_location: ""
          output_location: ""
          skip_app_build: true
